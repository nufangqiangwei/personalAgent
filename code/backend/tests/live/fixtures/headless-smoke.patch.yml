# Invocation-only probe: no Web changes, tools, reasoning or durable session logs.
- id: credentials
  disabled: false
  config:
    path: !!js process.env.PERSONAL_AGENT_DSH_CREDENTIAL_STORE
    watch: false
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
- id: llm-deepseek
  config:
    baseURL: https://api.deepseek.com/anthropic
    thinking: disabled
    reasoningEffort: off
    maxTokens: 32
    models:
      - id: deepseek-flash
        maxTokens: 32
    retryPolicy:
      mode: normal
      maxRetries: 0
- id: llm-retry
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: session-persistence-jsonl
  disabled: true
- id: session-query-sqlite
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: session-projection-cache
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: session-title-llm
  disabled: true
- id: compaction-basic
  disabled: true
- id: goal-round-driver
  disabled: true
- id: plan-mode
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
